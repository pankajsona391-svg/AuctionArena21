name: Build Auction Arena APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir project
          unzip -o GrokAuctionArena-full.zip -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)
          ANDROID_DIR=$(dirname "$SETTINGS")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Found: $ANDROID_DIR"

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuctionArena-APK
          path: '**/build/outputs/apk/**/*.apk'
